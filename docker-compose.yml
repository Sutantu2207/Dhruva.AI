# =============================================================================
# DHRUVA.AI - Local Development Infrastructure Services
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dhruva_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dhruva_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhruva_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dhruva_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhruva_admin} -d ${POSTGRES_DB:-dhruva_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dhruva_dev_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
