# ==============================================================================
# DHRUVA.AI — PRODUCTION CONTAINER TOPOLOGY
# Multi-Tier Zero-Trust Architecture: Reverse Proxy -> Frontend/API -> Data Layer
# ==============================================================================

services:
  # 1. Edge Ingress & Reverse Proxy (Only service exposing public ports 80 & 443)
  proxy:
    image: nginx:1.27-alpine
    container_name: dhruva_prod_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certs_data:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - dhruva_public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Frontend Web Application (Next.js 15 SSR / Static)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dhruva_prod_frontend
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dhruva_public
      - dhruva_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Backend Core API (FastAPI + Uvicorn)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dhruva_prod_backend
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - APPLICATION_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dhruva_internal
      - dhruva_public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # 4. Background Job Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dhruva_prod_worker
    restart: always
    command: ["python", "-m", "app.core.worker"]
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - APPLICATION_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dhruva_internal

  # 5. Background Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dhruva_prod_scheduler
    restart: always
    command: ["python", "-m", "app.core.scheduler"]
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - APPLICATION_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dhruva_internal

  # 6. Primary Relational & Vector Database (PostgreSQL 16 + pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dhruva_prod_postgres
    restart: always
    # STRICT SECURITY: Ports are NEVER published to host; internal Docker network only
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dhruva_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_prod_db_pw}
      POSTGRES_DB: ${POSTGRES_DB:-dhruva_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dhruva_internal

  # 7. Distributed Cache & Coordination (Redis 7 Alpine)
  redis:
    image: redis:7-alpine
    container_name: dhruva_prod_redis
    restart: always
    # STRICT SECURITY: Ports are NEVER published to host; internal Docker network only
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change_me_strong_redis_pw}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_strong_redis_pw}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dhruva_internal

networks:
  dhruva_public:
    driver: bridge
  dhruva_internal:
    driver: bridge
    internal: true

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  certs_data:
    driver: local
