name: DHRUVA.AI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend Test & Quality Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio flake8 bandit httpx

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r backend/app -ll -ii -x backend/tests

      - name: Linting (Flake8)
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate Alembic Migrations
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          cd backend
          alembic upgrade head --sql > migration_plan.sql
          echo "Migration SQL plan successfully generated:"
          head -n 30 migration_plan.sql

      - name: Run Test Suite (Domains 1-12)
        env:
          APPLICATION_ENV: test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_for_ci
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          AI_PROVIDER_API_KEY: ci_mock_gemini_key
        run: |
          cd backend
          pytest -v tests/

  frontend-quality-gate:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend ESLint
        working-directory: frontend
        run: npm run lint

      - name: Next.js Production Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  container-build-gate:
    name: Dockerfile Syntax & Container Build
    runs-on: ubuntu-latest
    needs: [ backend-quality-gate, frontend-quality-gate ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: dhruva-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: dhruva-frontend:ci-check
